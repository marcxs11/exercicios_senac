<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Exercício de envio de formulário com JavaScript.">
  <title>Formulário</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #9c8500;
      --muted: #010c08;
      --paper: #573c03dc;
      --white: #ffffff;
      --green: #a77d5a;
      --green-dark: #887f05c9;
      --line: #dbe9e0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 80vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#026b0b 0.9px, transparent 0.9px);
      background-size: 19px 19px;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
    }

    .painel {
      width: min(840px, 100%);
      min-height: 540px;
      display: grid;
      grid-template-columns: 0.92fr 1.08fr;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: 10px 24px 70px rgba(0, 0, 0, 0.12);
      animation: surgir 450ms ease-out both;
    }

    .marca {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 43px;
      color: var(--white);
      background: var(--green-dark);
    }

    .marca h1 {
      max-width: 290px;
      margin: 0 1 14px;
      font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      font-size: 45px;
      font-weight: 500;
      line-height: 1.10;
    }

    .marca p { max-width: 290px; margin: 0; color: #d1e4d9; line-height: 1.65; }
    .marca small { color: #d1e4d9; }

    .conteudo {
      display: flex;
      align-items: center;
      padding: 54px clamp(28px, 7vw, 72px);
    }

    .form-area { width: 100%; }

    .etiqueta {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    h2 { margin: 0; font-size: 29px; line-height: 1.2; }

    .introducao { margin: 11px 0 30px; color: var(--muted); line-height: 1.55; }

    .campo { margin-bottom: 19px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }

    input {
      width: 100%;
      min-height: 48px;
      padding: 0 13px;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 5px;
      font: inherit;
    }

    input:focus { outline: 3px solid rgb(23 107 80 / 18%); border-color: var(--green); }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 5px;
      color: var(--white);
      background: var(--green);
      border: 0;
      border-radius: 5px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--green-dark); }
    button:focus-visible { outline: 3px solid #84bda4; outline-offset: 3px; }

    .aviso {
      min-height: 24px;
      margin: 12px 0 0;
      font-size: 14px;
    }

    .aviso:empty { display: none; }
    .aviso:not(:empty) { color: var(--green-dark); }

    @keyframes surgir {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 680px) {
      body { padding: 16px; }
      .painel { grid-template-columns: 1fr; min-height: auto; }
      .marca { min-height: 205px; padding: 25px; }
      .marca h1 { margin-top: 26px; font-size: 32px; }
      .marca p, .marca small { display: none; }
      .conteudo { padding: 34px 25px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="painel">
    <aside class="marca" aria-label="Área do aluno">
      <div>
        <h1>Cadastro</h1> 
        <h2>Preencha o formulário para se cadastrar!  </h2>
      </div>
    
    </aside>

    <section class="conteudo" aria-live="polite">
      <div class="form-area">
        <p class="etiqueta">Formulário</p>
        <h2>Envie seus dados</h2>
        <p class="introducao">Preencha com as informações solicitadas.</p>

        <form id="form-contato">
          <div class="campo">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" autocomplete="name" required>
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <button type="submit">Enviar</button>
          <p class="aviso" id="mensagem" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <script>
const formContato = document.querySelector("#form-contato");
const campoNome = document.querySelector("#nome");
const mensagem = document.querySelector("#mensagem");

formContato.addEventListener("submit", (evento) => {
  evento.preventDefault();

  const nome = campoNome.value.trim();
  mensagem.textContent = `Obrigado, ${nome}! Seu formulário foi enviado com sucesso.`;
  formContato.reset();
});

  </script>
</body>
</html>
