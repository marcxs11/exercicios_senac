<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Exercício de formulário de login com validação em JavaScript.">
  <title>Acesso | Área do aluno</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #292117;
      --muted: #010c08;
      --paper: #f5f7f2;
      --white: #ffffff;
      --green: #cf6106;
      --green-dark: #c96c15;
      --line: #dbe9e0;
      --error: #a10e09;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 80vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#cbd9ce 0.8px, transparent 0.8px);
      background-size: 19px 19px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .painel {
      width: min(840px, 100%);
      min-height: 540px;
      display: grid;
      grid-template-columns: 0.92fr 1.08fr;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: 10px 24px 70px rgba(0, 0, 0, 0.12);
      animation: surgir 450ms ease-out both;
    }

    .marca {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 42px;
      color: var(--white);
      background: var(--green-dark);
    }

    .selo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgb(238, 183, 4);
      border-radius: 50%;
      font-size: 20px;
    }

    .marca h1 {
      max-width: 290px;
      margin: 0 1 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 50px;
      font-weight: 500;
      line-height: 1.10;
    }

    .marca p { max-width: 290px; margin: 0; color: #d1e4d9; line-height: 1.65; }
    .marca small { color: #d1e4d9; }

    .conteudo {
      display: flex;
      align-items: center;
      padding: 54px clamp(28px, 7vw, 72px);
    }

    .form-area { width: 100%; }

    .etiqueta {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    h2 { margin: 0; font-size: 29px; line-height: 1.2; }

    .introducao { margin: 11px 0 30px; color: var(--muted); line-height: 1.55; }

    .campo { margin-bottom: 19px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }

    input {
      width: 100%;
      min-height: 48px;
      padding: 0 13px;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 5px;
      font: inherit;
    }

    input:focus { outline: 3px solid rgb(23 107 80 / 18%); border-color: var(--green); }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 5px;
      color: var(--white);
      background: var(--green);
      border: 0;
      border-radius: 5px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--green-dark); }
    button:focus-visible { outline: 3px solid #84bda4; outline-offset: 3px; }

    .aviso {
      min-height: 24px;
      margin: 12px 0 0;
      color: var(--error);
      font-size: 14px;
    }

    .dica {
      margin: 18px 0 0;
      padding-top: 15px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.6;
    }

    .dica strong { color: var(--ink); }

    .boas-vindas { text-align: left; }
    .boas-vindas .selo { margin-bottom: 30px; color: var(--green); border-color: var(--line); }
    .boas-vindas p:not(.etiqueta) { color: var(--muted); line-height: 1.6; }
    .boas-vindas button { margin-top: 20px; }

    [hidden] { display: none !important; }

    @keyframes surgir {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 680px) {
      body { padding: 16px; }
      .painel { grid-template-columns: 1fr; min-height: auto; }
      .marca { min-height: 205px; padding: 25px; }
      .marca h1 { margin-top: 26px; font-size: 32px; }
      .marca p, .marca small { display: none; }
      .conteudo { padding: 34px 25px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="painel">
    <aside class="marca" aria-label="Área do aluno">
      <div>
        <h1>Hora de retomar os estudos!</h1>
        <p>Entre para continuar de onde você parou.</p>
      </div>
      <small>Exercícios de HTML e JavaScript</small>
    </aside>

    <section class="conteudo" aria-live="polite">
      <div class="form-area" id="area-login">
        <p class="etiqueta">Área do aluno</p>
        <h2>Fazer login</h2>
        <p class="introducao">Insira seus <strong>dados</strong> para acessar.</p>

        <form id="form-login">
          <div class="campo">
            <label for="usuario">Usuário</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username" required>
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit">Entrar</button>
          <p class="aviso" id="mensagem" role="alert"></p>
        </form>

        <p class="dica">Acesso para testar: usuário <strong>aluno</strong> e senha <strong>senac123</strong>.</p>
      </div>

      <div class="form-area boas-vindas" id="area-protegida" hidden>
        <div class="selo" aria-hidden="true">✓</div>
        <p class="etiqueta">Acesso autorizado</p>
        <h2>Bem-vindo, aluno!</h2>
        <p>Retome seus estudos de onde você parou.</p>
        <button id="botao-sair" type="button">Sair</button>
      </div>
    </section>
  </main>

  <script>
const formLogin = document.querySelector("#form-login");
const campoUsuario = document.querySelector("#usuario");
const campoSenha = document.querySelector("#senha");
const mensagem = document.querySelector("#mensagem");
const areaLogin = document.querySelector("#area-login");
const areaProtegida = document.querySelector("#area-protegida");

formLogin.addEventListener("submit", (evento) => {
  evento.preventDefault();

  if (campoUsuario.value.trim() === "aluno" && campoSenha.value === "senac123") {
    mensagem.textContent = "";
    areaLogin.hidden = true;
    areaProtegida.hidden = false;
    areaProtegida.querySelector("button").focus();
    return;
  }

  mensagem.textContent = "Usuário ou senha incorretos. Tente novamente.";
  campoSenha.value = "";
  campoSenha.focus();
});

document.querySelector("#botao-sair").addEventListener("click", () => {
  areaProtegida.hidden = true;
  areaLogin.hidden = false;
  formLogin.reset();
  campoUsuario.focus();
});

  </script>
</body>
</html>
